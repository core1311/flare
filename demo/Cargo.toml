[package]
name = "fiery-topaz"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flare-chart = { path = "../chart" }

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "DomTokenList",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlBodyElement",
    "Window",
    "Node",
]
