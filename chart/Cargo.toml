[package]
name = "flare-chart"
version = "0.1.0"
edition.workspace = true
description = "WebAssembly canvas chart renderer for Flare"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flare-core = { path = "../crates/flare-core" }

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "TextMetrics",
    "Window",
    "Node",
    "CssStyleDeclaration",
    "Performance",
    "MediaQueryList",
]
